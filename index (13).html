.grab{width:42px;height:5px;border-radius:99px;background:var(--ln);margin:0 auto 12px}
#rv.on{display:flex;flex-direction:column;background:rgba(12,10,28,.85)}
.rvt{display:flex;gap:8px;padding:12px 16px;background:var(--sf);border-bottom:1px solid var(--ln)}
.rvb{flex:1;overflow:auto;padding:16px;display:flex;justify-content:center}
.sw{display:flex;gap:8px}.sw button{width:32px;height:32px;border-radius:50%;border:2px solid transparent}.sw button.on{border-color:var(--ink)}
.ck{display:flex!important;align-items:center;gap:8px;cursor:pointer}
.fab{position:fixed;right:16px;bottom:calc(88px + env(safe-area-inset-bottom));width:46px;height:46px;border-radius:50%;background:var(--pr);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.25);z-index:22}
#mcp{position:fixed;right:16px;bottom:calc(142px + env(safe-area-inset-bottom));width:240px;background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:12px;box-shadow:0 16px 36px rgba(0,0,0,.28);display:none;z-index:25}#mcp.on{display:block}
#mcd{background:var(--bg);padding:10px;border-radius:12px;text-align:right;font:700 20px var(--f1);margin-bottom:8px;overflow:hidden}
.mk{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.mk button{padding:10px;border-radius:10px;background:var(--bg);font-weight:700}
.v{animation:vin .22s ease-out}@keyframes vin{from{opacity:0;transform:translateY(10px)}}
#pr{display:none}
.sheet{font:13px/1.5 Arial,sans-serif;color:#000;background:#fff;padding:24px}.sheet h2{margin:0 0 4px;font-size:20px}.sheet table{width:100%;border-collapse:collapse;margin-top:14px}.sheet td,.sheet th{border-bottom:1px solid #bbb;padding:6px 4px;text-align:left}
html[lang=bn]{--f1:'Anek Bangla','Hind Siliguri','Bricolage Grotesque',system-ui,sans-serif;--f2:'Hind Siliguri','Anek Bangla','Hanken Grotesk',system-ui,sans-serif}
html[lang=bn] body{line-height:1.65}
html[lang=bn] #app,html[lang=bn] #app *{letter-spacing:0!important}
html[lang=bn] .hero h2{line-height:1.3;max-width:none}
html[lang=bn] .bar h1,html[lang=bn] .sh h3,html[lang=bn] .card b,html[lang=bn] .row b,html[lang=bn] .set h4,html[lang=bn] .fh h4{line-height:1.45}
html[lang=bn] .tb a{font-size:12.5px}
html[lang=bn] .sh h3{font-size:20px}
html[lang=bn] .lastc small,html[lang=bn] .fd label{font-size:13px}
.wn{transition:opacity .2s}
@page{size:A4;margin:0}
@media print{
html,body{margin:0!important;padding:0!important;background:#fff!important;height:auto!important}
body>*:not(#pr){display:none!important}
#pr{display:block!important}
#pr .rp{width:210mm;min-height:296mm;padding:10mm 13mm;overflow:hidden}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

{id:'anticoagulant-calculator',t:'Anticoagulant Calc',d:'Adjust blood bag volumes.',g:'util',i:'drop',k:'cpda blood bag donation',o:{init:1,auto:1,

{id:'electrolyte-verification',t:'Electrolyte Check',d:'Verify ion panel consistency.',g:'elec',i:'bolt',k:'tco2 anion gap sodium potassium chloride bicarbonate balance',o:{b:'Verify Electrolytes',
