/* ---------- tool page ---------- */
function field(t,f){const st=S.v[t.id],id='i-'+f.id;return`<div class="fd${f.h?' h':''}" ${vis(f,t)?'':'hidden'}><label for="${id}">${f.l}</label>${f.s?`<select id="${id}" data-i="${f.id}">${f.opts.map(([v,l])=>`<option value="${v}"${st[f.id]==v?' selected':''}>${l}</option>`).join('')}</select>`:`<div class="in"><input id="${id}" data-i="${f.id}" inputmode="decimal" autocomplete="off" enterkeyhint="done" placeholder="${f.ph||''}" value="${esc(st[f.id])}">${f.u?`<span>${f.u}</span>`:''}</div>`}</div>`}
function ro(t){const r=t.c(V(t),S.sh);S.out=r&&!r.err?r:null;const act=`<div class="ac"><button data-a="copy" ${S.out?'':'disabled'}>${ic('copy')}Copy</button><button data-a="save" ${S.out?'':'disabled'}>${ic('save')}Save</button>${navigator.share?`<button data-a="share" ${S.out?'':'disabled'}>${ic('share')}Share</button>`:''}<button data-a="reset">${ic('reset')}Reset</button></div>`;
if(!r)return`<div class="l">Result</div><div class="big e">—</div><div class="gs" style="font-size:13px">Enter the values below</div>${act}`;
if(r.err)return`<div class="l">Check your inputs</div><div class="err">${r.err}</div>${act}`;
const p=r[0],z=stat(p);return`<div class="l"><span>${p.l}</span>${pill(z)}</div><div class="big">${fm(p.v,p.d)}<small>${p.u}</small></div>${p.z?gauge(p):''}${p.r?`<div class="gs" style="font-size:12.5px;margin-top:8px">Reference: ${p.r}</div>`:''}${r.length>1?`<div class="sg">${r.slice(1).map(o=>`<div><em>${o.l}</em><strong>${fm(o.v,o.d)}</strong><small>${o.u}</small>${pill(stat(o))}</div>`).join('')}</div>`:''}${r.n?`<div class="gs" style="font-size:12.5px;margin-top:12px;display:block;line-height:1.4">${r.n}</div>`:''}${act}`}
const upd=()=>{const t=S.cur;if(t&&t.F)$('#ro').innerHTML=ro(t)};
function tool(t){const c=CAT[t.g];S.cur=t;if(t.x=='rep')return rep();if(t.x=='cv')return conv();init(t);
return`<div style="--c:${c[1]}"><section class="ro" id="ro">${ro(t)}</section><div class="fm">${t.f}</div><div class="fc" id="fc">${t.F.map(f=>field(t,f)).join('')}</div></div>`}
/* converter */
function conv(){const c=CV[S.cv.i];return`<div class="fc" style="margin-top:6px"><div class="fd"><label for="cs">Test</label><select id="cs">${CV.map((x,i)=>`<option value="${i}"${i==S.cv.i?' selected':''}>${x[0]}</option>`).join('')}</select></div><div class="fd"><label for="ca">${c[1]}</label><div class="in"><input id="ca" data-cv="a" inputmode="decimal" value="${esc(S.cv.a)}" placeholder="Enter value"><span>${c[1]}</span></div></div><div class="fd" style="text-align:center"><button class="btn" data-a="swp" style="padding:8px 18px">${ic('swap')}</button></div><div class="fd"><label for="cb">${c[2]}</label><div class="in"><input id="cb" data-cv="b" inputmode="decimal" value="${esc(S.cv.b)}" placeholder="Result"><span>${c[2]}</span></div></div></div><p class="nt">${typeof c[3]=='number'?`1 ${c[1]} = ${c[3]} ${c[2]}`:'Formula-based conversion'}. Type in either box.</p>`}
function cvset(w){const c=CV[S.cv.i],x=num(S.cv[w]),o=w=='a'?'b':'a';if(x==null){S.cv[o]='';}else{const f=w=='a'?(typeof c[3]=='number'?x*c[3]:c[3](x)):(typeof c[3]=='number'?x/c[3]:c[4](x));S.cv[o]=String(+f.toPrecision(5))}const e=$('#c'+o);if(e)e.value=S.cv[o]}
/* report */
const flag=(r,g)=>{const x=num(r),m=String(g).match(/([\d.]+)\s*[-–]\s*([\d.]+)/),l=String(g).match(/<\s*([\d.]+)/),h=String(g).match(/>\s*([\d.]+)/);if(x==null)return'';if(m)return x<+m[1]?'L':x>+m[2]?'H':'';if(l)return x>=+l[1]?'H':'';if(h)return x<=+h[1]?'L':'';return''};
const QA=[['Glucose','mg/dL','70–100'],['Urea','mg/dL','15–40'],['Creatinine','mg/dL','0.6–1.3'],['Sodium','mEq/L','135–145'],['Potassium','mEq/L','3.5–5.1'],['Cholesterol','mg/dL','< 200'],['Triglycerides','mg/dL','< 150'],['Hemoglobin','g/dL','12–16']];
function rtext(){const r=S.rp;return`LABORATORY REPORT\nPatient: ${r.p}  ID: ${r.pid}  Date: ${r.dt}\n`+r.rows.filter(x=>x.n).map(x=>`${x.n}: ${x.r} ${x.u} ${flag(x.r,x.g)} (ref ${x.g})`).join('\n')}
function rhtml(){const r=S.rp;return`<div class="sheet"><h2>Laboratory Report</h2><div>Patient: <b>${esc(r.p)}</b> &nbsp; ID: ${esc(r.pid)} &nbsp; Date: ${esc(r.dt)}</div><table><tr><th>Test</th><th>Result</th><th>Unit</th><th>Reference</th></tr>${r.rows.filter(x=>x.n).map(x=>`<tr><td>${esc(x.n)}</td><td><b>${esc(x.r)} ${flag(x.r,x.g)}</b></td><td>${esc(x.u)}</td><td>${esc(x.g)}</td></tr>`).join('')}</table></div>`}
const rrows=()=>S.rp.rows.map((x,i)=>`<div class="rr"><input class="w" data-r="n" data-i="${i}" placeholder="Test name" value="${esc(x.n)}"><button class="ib" data-a="rdel" data-i="${i}" aria-label="Remove row">${ic('trash')}</button><input data-r="r" data-i="${i}" placeholder="Result" inputmode="decimal" value="${esc(x.r)}"><input data-r="u" data-i="${i}" placeholder="Unit" value="${esc(x.u)}"><input data-r="g" data-i="${i}" placeholder="Range" value="${esc(x.g)}"></div>`).join('');
function rep(){const r=S.rp;return`<div class="fc" style="margin-top:6px"><div class="fd"><label>Patient name</label><div class="in"><input data-p="p" value="${esc(r.p)}"></div></div><div class="fd h"><label>ID</label><div class="in"><input data-p="pid" value="${esc(r.pid)}"></div></div><div class="fd h"><label>Date</label><div class="in"><input type="date" data-p="dt" value="${esc(r.dt)}"></div></div></div>
<div class="sh" style="padding-top:6px"><h3>Results</h3></div><div class="chips">${QA.map((q,i)=>`<button class="chip" data-a="radd" data-i="${i}">+ ${q[0]}</button>`).join('')}</div><div class="fc" style="display:block" id="rr">${rrows()}<button class="btn" data-a="radd" data-i="-1">+ Add row</button></div>
<div class="ac" style="margin:0 16px"><button class="btn" style="flex:1" data-a="rprint">Print report</button><button class="btn" style="flex:1" data-a="rcopy">Copy text</button><button class="btn d" style="flex:0 0 auto" data-a="rclr">Clear</button></div>`}
/* ---------- shell ---------- */
function bar(tab,t){$('#bar').innerHTML=t?`<button class="ib" data-a="back" aria-label="Back">${ic('back')}</button><h1>${t.t}</h1><button class="ib${S.pins.includes(t.id)?' on':''}" data-a="pin" data-id="${t.id}" aria-label="Pin to home">${ic('star')}</button>`:`<div class="logo"><svg viewBox="0 0 24 24" style="width:20px;height:20px;stroke-width:2.6"><path d="M12 5v14M5 12h14"/></svg></div><h1>LabGenie</h1><button class="ib" data-a="srch" aria-label="Search">${ic('search')}</button><button class="ib" data-a="tgl" aria-label="Toggle theme">${ic('moon')}</button>`}
function nav(tab){$('#tb').innerHTML=[['home','Home','home'],['tools','Tools','grid'],['history','Saved','hist'],['more','More','more']].map(([h,l,i])=>`<a href="#${h}" class="${tab==h?'on':''}">${ic(i)}${l}</a>`).join('')}
function render(){const h=decodeURIComponent(location.hash.slice(1)),t=h&&by(h);let tab=h||'home',html;S.cur=null;S.edit=t?0:S.edit;
if(t){tab='tool';html=tool(t);S.rec=[t.id,...S.rec.filter(x=>x!=t.id)].slice(0,6);ST.set('rec',S.rec)}
else if(h=='tools')html=tools();else if(h=='history')html=hist();else if(h=='more'||h=='help'||h=='dev-instructions'){tab='more';html=more()}else{tab='home';html=home()}
bar(tab,t);nav(tab=='tool'?'':tab);const v=$('#v');v.className='v';v.innerHTML=html;void v.offsetWidth;window.scrollTo(0,0);document.title=t?t.t+' | LabGenie':'LabGenie';if(t&&t.x=='cv')cvset('a')}
const re=()=>{const y=scrollY,v=$('#v');v.innerHTML=({home,tools,history:hist,more}[location.hash.slice(1)||'home']||home)();scrollTo(0,y)};
addEventListener('hashchange',()=>{S.nav++;render()});
/* ---------- events ---------- */
document.addEventListener('click',e=>{
const cd=e.target.closest('a.card[data-id]');if(S.edit&&cd){e.preventDefault();S.pins=S.pins.filter(x=>x!=cd.dataset.id);ST.set('pins',S.pins);return re()}
const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,d=b.dataset;if(b.closest('a'))e.preventDefault();
const A={back:()=>S.nav?history.back():(location.hash='home'),
srch:()=>{location.hash='tools';setTimeout(()=>{const q=$('#q');q&&q.focus()},60)},
tgl:()=>{S.th=document.documentElement.dataset.e=='dark'?'light':'dark';ST.set('th',S.th);theme()},
edit:()=>{S.edit=!S.edit;re()},
cat:()=>{S.cat=d.k;if(location.hash!='#tools')location.hash='tools';else re()},
pin:()=>{const i=S.pins.indexOf(d.id);i<0?S.pins.push(d.id):S.pins.splice(i,1);ST.set('pins',S.pins);toast(i<0?'Pinned to Home':'Removed from Home');if(S.cur)bar('tool',S.cur);else re()},
copy:()=>cp(sumry()),save:()=>{S.hist.unshift({ts:Date.now(),tx:sumry()});S.hist=S.hist.slice(0,100);ST.set('hist',S.hist);toast('Saved to history')},
share:()=>navigator.share({title:S.cur.t,text:sumry()}).catch(()=>{}),
reset:()=>{delete S.v[S.cur.id];$('#v').innerHTML=tool(S.cur)},
hcopy:()=>cp(S.hist[d.i].tx),hdel:()=>{S.hist.splice(d.i,1);ST.set('hist',S.hist);re()},hclr:()=>{S.hist=[];ST.set('hist',[]);re()},
th:()=>{S.th=d.v;ST.set('th',S.th);theme();re()},dec:()=>{S.dec=d.v;ST.set('dec',S.dec);re()},rst:()=>{S.pins=[...DEF];ST.set('pins',S.pins);toast('Shortcuts reset')},
swp:()=>{const c=CV[S.cv.i];CV[S.cv.i]=[c[0],c[2],c[1],typeof c[3]=='number'?1/c[3]:c[4],c[3]];S.cv.a=S.cv.b;cvset('a');$('#v').innerHTML=conv()},
radd:()=>{const q=QA[d.i];S.rp.rows=S.rp.rows.filter(x=>x.n||x.r);S.rp.rows.push(q?{n:q[0],r:'',u:q[1],g:q[2]}:{n:'',r:'',u:'',g:''});sv();$('#rr').innerHTML=rrows()+'<button class="btn" data-a="radd" data-i="-1">+ Add row</button>'},
rdel:()=>{S.rp.rows.splice(d.i,1);sv();$('#rr').innerHTML=rrows()+'<button class="btn" data-a="radd" data-i="-1">+ Add row</button>'},
rprint:()=>{$('#pr').innerHTML=rhtml();print()},rcopy:()=>cp(rtext()),rclr:()=>{S.rp.rows=[{n:'',r:'',u:'',g:''}];S.rp.p=S.rp.pid='';sv();$('#v').innerHTML=rep()}};A[a]&&A[a]()});
const sv=()=>ST.set('rp',S.rp);
function sumry(){return S.cur.t+'\n'+S.out.map(line).join('\n')}
function cp(x){const f=()=>{const t=document.createElement('textarea');t.value=x;document.body.appendChild(t);t.select();try{document.execCommand('copy')}catch(e){}t.remove()};(navigator.clipboard?navigator.clipboard.writeText(x).catch(f):f());toast('Copied')}
document.addEventListener('input',e=>{const el=e.target;
if(el.id=='q'){S.q=el.value;$('#list').innerHTML=list()}
else if(el.dataset.cv){S.cv[el.dataset.cv]=el.value;cvset(el.dataset.cv)}
else if(el.dataset.p){S.rp[el.dataset.p]=el.value;sv()}
else if(el.dataset.r){S.rp.rows[el.dataset.i][el.dataset.r]=el.value;sv()}
else if(el.dataset.i&&S.cur){S.v[S.cur.id][el.dataset.i]=el.value;upd()}});
document.addEventListener('change',e=>{const el=e.target;if(el.id=='cs'){S.cv={i:+el.value,a:'',b:''};$('#v').innerHTML=conv()}
else if(el.dataset.i&&S.cur&&el.tagName=='SELECT'){S.v[S.cur.id][el.dataset.i]=el.value;$('#fc').innerHTML=S.cur.F.map(f=>field(S.cur,f)).join('');upd()}});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.tagName=='INPUT')e.target.blur()});
document.addEventListener('focusin',e=>{if(/INPUT|SELECT/.test(e.target.tagName)&&S.cur)document.body.classList.add('kb')});
document.addEventListener('focusout',()=>setTimeout(()=>{if(!/INPUT|SELECT/.test(document.activeElement.tagName))document.body.classList.remove('kb')},120));
/* ---------- boot ---------- */
theme();render();
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
</script>
</body>
</html>
