{id:'dilution-calculator',t:'Dilution Calc',d:'Compute dilution volumes.',g:'util',i:'dil',k:'c1v1 diluent factor ratio',o:{init:1,b:'Calculate',

{id:'anticoagulant-calculator',t:'Anticoagulant Calc',d:'Adjust blood bag volumes.',g:'util',i:'drop',k:'cpda blood bag donation',o:{init:1,auto:1,
F:[{t:'h',l:'Standard Bag Parameters',s:'Based on a standard 450 ml blood bag containing 63 ml of anticoagulant.'},{t:'n',id:'vol',l:'Target Blood Collection Volume (ml)',ph:'e.g., 300',def:'450'}],
go:v=>{const tv=v.vol||0,rq=tv*(63/450),rm=63-rq;let g,k,sc;
if(tv<=0){g='Please enter a target blood volume to see the guidance.';k='b';sc=null}
else if(rm<-.1){g='Warning: Target volume exceeds the standard 450 ml. The standard anticoagulant amount is insufficient.';k='r';sc='r'}
else if(rm<.1){g='No adjustment needed. The standard anticoagulant volume is correct for this blood volume.';k='g';sc='g'}
else{g=`For a collection of ${tv} ml, first remove ${rm.toFixed(1)} ml of anticoagulant from the bag (Only if the bag contain 63 ml).`;k='y';sc='y'}
const a=Math.max(0,rq),b=Math.max(0,rm);
return{st:sc,tx:`Target blood volume: ${tv} ml\nRequired anticoagulant: ${fm(a,1)} ml\nAnticoagulant to remove: ${fm(b,1)} ml\n${g}`,
html:hd('Results & Guidance')+pr2(tl('Required Anticoagulant for Target Volume',fm(a,1),'ml'),tl('Anticoagulant to REMOVE from Bag',fm(b,1),'ml',{c:b>=.1?'hl':''}))+bn(k+' sm',g)+nl(['The standard ratio is 14 ml of anticoagulant per 100 ml of blood.','This tool calculates how much anticoagulant to remove for partial draws.'])}}}},
{id:'LDL-calculator',t:'LDL Calculator',d:'Calculate LDL levels.',g:'lipid',i:'heart',k:'cholesterol friedewald hdl triglycerides lipid',o:{b:'Calculate LDL',
F:[{t:'h',l:'Lipid Panel Inputs'},{t:'n',id:'tc',l:'Total Cholesterol (mg/dL)',ph:'e.g., 200'},{t:'n',id:'hdl',l:'HDL Cholesterol (mg/dL)',ph:'e.g., 50'},{t:'n',id:'tg',l:'Triglycerides (mg/dL)',ph:'e.g., 150'}],
go:v=>{const{tc,hdl,tg}=v;if(tc==null||hdl==null||tg==null||tc<=0||hdl<=0||tg<=0)return{err:'Please enter valid, positive numbers for all fields.'};if(tc<hdl)return{err:'Total Cholesterol cannot be less than HDL Cholesterol.'};
const nh=tc-hdl,fr=nh-tg/5,al=nh*.75,hi=tg>=400;
return{st:null,tx:`LDL (Friedewald): ${fm(fr,1)} mg/dL\nLDL (Alternative, high TG): ${fm(al,1)} mg/dL\nRecommended: ${hi?'Alternative formula':'Friedewald formula'}`,
html:hd('LDL Cholesterol')+pr2(tl('LDL (Friedewald Formula)',fm(fr,1),'mg/dL',{c:hi?'':'rec',b:hi?'':'Recommended'}),tl('LDL (Alternative Formula for High TG)',fm(al,1),'mg/dL',{c:hi?'rec':'',b:hi?'Recommended':''}))+nb(hi?'Triglycerides are 400 mg/dL or higher, making the Friedewald formula unreliable. The alternative calculation is recommended.':'Triglycerides are below 400 mg/dL, so the Friedewald formula is the recommended method for estimation.')}}}},
{id:'egfr-calculator',t:'eGFR (MDRD)',d:'Estimate kidney function.',g:'renal',i:'gear',k:'gfr mdrd bsa ckd creatinine body surface',o:{b:'Calculate eGFR',
F:[{t:'h',l:'Patient Data'},{t:'n',id:'scr',l:'Serum Creatinine (mg/dL)',ph:'e.g., 1.2'},{t:'n',id:'age',l:'Age (Years)',ph:'e.g., 55'},{t:'b',id:'sx',l:'Sex',o:[['male','Male'],['female','Female']]},{t:'b',id:'rc',l:'Race',o:[['nonblack','Non-Black'],['black','Black']]}],
go:v=>{const{scr,age,sx,rc}=v;if(scr==null||age==null||scr<=0||age<=0)return{err:'Please enter valid, positive numbers for Creatinine and Age.'};
let g=175*Math.pow(scr,-1.154)*Math.pow(age,-.203);if(sx=='female')g*=.742;if(rc=='black')g*=1.212;
const s=g>=90?[0,'CKD Stage 1','g']:g>=60?[1,'CKD Stage 2','g']:g>=45?[2,'CKD Stage 3a','y']:g>=30?[3,'CKD Stage 3b','y']:g>=15?[4,'CKD Stage 4','r']:[5,'CKD Stage 5','r'];
const R=[['Stage 1','≥ 90','Normal or high GFR'],['Stage 2','60 – 89','Mildly decreased GFR'],['Stage 3a','45 – 59','Mild-moderately decreased'],['Stage 3b','30 – 44','Moderate-severely decreased'],['Stage 4','15 – 29','Severely decreased GFR'],['Stage 5','&lt; 15','Kidney failure']];
return{st:s[2],tx:`Estimated GFR (MDRD): ${fm(g,0)} mL/min/1.73 m²\n${s[1]}`,
html:hd('Estimated GFR (MDRD)')+big(fm(g,0),'mL/min/1.73 m²')+gauge({sc:[0,120],z:Z([[15,'Stage 5','r'],[30,'Stage 4','r'],[45,'Stage 3b','y'],[60,'Stage 3a','y'],[90,'Stage 2','g'],[I,'Stage 1','g']]),v:g})+bn(s[2],s[1])+`<div class="stg">${R.map((r,i)=>`<div class="${i==s[0]?'on':''}"><b>${r[0]}</b><span>${r[1]}</span><span>${r[2]}</span></div>`).join('')}</div>`+nb('<b>Note:</b> This calculator uses the original MDRD formula, which includes a race-based variable. Modern guidelines often recommend the CKD-EPI 2021 equation, which omits race.')}}}},
{id:'uacr-calculator',t:'UACR Calculator',d:'Albumin / creatinine ratio.',g:'renal',i:'uri',k:'microalbumin macr albumin creatinine ratio urine',o:{b:'Calculate UACR',
F:[{t:'h',l:'Urine Sample Values'},{t:'n',id:'al',l:'Urine Albumin (mg/L)',ph:'e.g., 15'},{t:'b',id:'u',l:'Select Unit for Urine Creatinine',o:[['mg/dL','mg/dL'],['mmol/L','mmol/L']]},{t:'n',id:'cr',l:v=>`Urine Creatinine (${v.u})`,ph:v=>v.u=='mg/dL'?'e.g., 120':'e.g., 10.6'}],
go:v=>{let{al,cr,u}=v;if(al==null||cr==null)return{err:'Please fill in all required fields.'};if(u=='mmol/L')cr*=113.12/10;const cg=cr/100;if(cg<=0)return{err:'Urine creatinine must be a positive value.'};
const r=al/cg,k=r<30?0:r<=300?1:2,L=['Normal to Mildly Increased','Moderately Increased','Severely Increased'],T=['g','y','r'];
return{st:T[k],tx:`Albumin/Creatinine Ratio (UACR): ${fm(r,2)} mg/g\n${L[k]}`,
html:hd('Albumin/Creatinine Ratio (UACR)')+big(fm(r,2),'mg/g')+gauge({sc:[0,400],z:Z([[30,L[0],'g'],[300,L[1],'y'],[I,L[2],'r']]),v:r})+bn(T[k],L[k])+`<ul class="nl"><li style="list-style:none;margin-left:-16px"><b>KDIGO Categories for Albuminuria</b></li>${[['&lt; 30 mg/g','Normal to Mildly Increased'],['30 - 300 mg/g','Moderately Increased'],['&gt; 300 mg/g','Severely Increased']].map((x,i)=>i==k?`<li><b>${x[0]}: ${x[1]}</b></li>`:`<li>${x[0]}: ${x[1]}</li>`).join('')}</ul>`}}}},
{id:'electrolyte-verification',t:'Electrolyte Check',d:'Verify ion panel consistency.',g:'elec',i:'bolt',k:'tco2 anion gap sodium potassium chloride bicarbonate balance',o:{b:'Verify Electrolytes',
F:[{t:'h',l:'Patient Values'},{t:'n',id:'na',h:1,l:'Na⁺ (mmol/L)'},{t:'n',id:'k',h:1,l:'K⁺ (mmol/L)'},{t:'n',id:'cl',h:1,l:'Cl⁻ (mmol/L)'},{t:'n',id:'hco3',h:1,l:'HCO₃⁻ (Optional)'},{t:'n',id:'co2',l:'Total CO₂ (Optional)'},{t:'n',id:'glucose',h:1,l:'Glucose (Optional) mmol/L'},{t:'n',id:'albumin',h:1,l:'Albumin (Optional) g/dL'}],
go:v=>{const V={};for(const k in v)V[k]=v[k]||null;if(!V.na||!V.k||!V.cl)return{err:'Please enter required values: Na⁺, K⁺, and Cl⁻.'};
let hc=V.hco3,est=false;if(hc==null){hc=V.na-V.cl-12;est=true}
const eco=hc+2,cna=V.glucose?V.na+2.4*((V.glucose-5.5)/5.5):null,ag=V.na-(V.cl+hc),cag=V.albumin?ag+2.5*(4.4-V.albumin):null,nd=V.na-V.cl;
const sz=(x,lo,hi)=>x<lo?{l:'LOW',t:'y'}:x>hi?{l:'HIGH',t:'r'}:{l:'NORMAL',t:'g'},za=sz(cag??ag,8,16),f=x=>fm(x,1);
let calc='';if(est)calc+=rowx('Estimated HCO₃⁻',f(hc),'mmol/L');if(!V.co2)calc+=rowx('Estimated Total CO₂',f(eco),'mmol/L');if(cna!=null)calc+=rowx('Corrected Sodium',f(cna),'mmol/L');
return{st:za.t,tx:`Anion gap: ${f(ag)} mmol/L (${sz(ag,8,16).l})`+(cag!=null?`\nAlbumin-corrected AG: ${f(cag)} mmol/L (${sz(cag,8,16).l})`:'')+`\nNa-Cl differential: ${f(nd)} mmol/L (${sz(nd,32,40).l})`+(est?`\nEstimated HCO3: ${f(hc)} mmol/L`:'')+(cna!=null?`\nCorrected Na: ${f(cna)} mmol/L`:''),
html:hd('Anion Gap (AG)',pill(sz(ag,8,16)))+big(f(ag),'mmol/L')+gauge({sc:[0,32],z:Z([[8,'Low','y'],[16,'Normal','g'],[I,'High','r']]),v:ag})+`<div class="gs" style="margin-top:8px;font-size:12.5px;display:block">Normal Range: 8-16 mmol/L.</div>`+(est?bn('y sm','HCO₃⁻ was not entered, so it is estimated as Na − Cl − 12 and the anion gap will always read 12. Enter a measured HCO₃⁻ for a meaningful anion gap.'):'')
+(cag!=null?grp('Anion Gap Analysis',rowx('Albumin-Corrected AG',f(cag),'mmol/L',sz(cag,8,16)),'Albumin-corrected AG is the recommended value for interpretation. Normal: 8-16 mmol/L.'):'')
+(calc?grp('Calculated Values',calc):'')+grp('Electrolyte Balance Checks',rowx('Sodium-Chloride Differential',f(nd),'mmol/L',sz(nd,32,40)),'A normal Na-Cl difference is typically 32-40 mmol/L.')}}}},
{id:'osmolality-calculator',t:'Osmolality Calc',d:'Calculate osmolal gap.',g:'elec',i:'pin',k:'serum osmolarity gap tonicity',o:{b:'Calculate',
F:[{t:'h',l:'Analyte Values'},{t:'b',id:'u',l:'Select Units for Glucose & Urea',o:[['mmol/L','mmol/L'],['mg/dL','mg/dL']]},{t:'n',id:'na',l:'Sodium (Na⁺)',ph:'mmol/L'},{t:'n',id:'gl',l:v=>`Glucose (${v.u})`,ph:v=>v.u=='mmol/L'?'e.g., 5.5':'e.g., 100'},{t:'n',id:'ur',l:v=>v.u=='mmol/L'?'Urea (mmol/L)':'Blood Urea Nitrogen (BUN) (mg/dL)',ph:v=>v.u=='mmol/L'?'e.g., 5':'e.g., 15'},{t:'n',id:'ms',l:'Measured Osmolality (Optional)',ph:'mOsm/kg'}],
go:v=>{let{na,gl,ur,ms,u}=v;if(na==null||gl==null||ur==null)return{err:'Please fill in all required fields (Na, Glucose, Urea).'};if(u=='mg/dL'){gl/=18;ur/=2.8}
const c=2*na+gl+ur,gap=ms!=null&&ms>0?ms-c:null,hi=gap!=null&&gap>15;
return{st:gap==null?null:hi?'r':'g',tx:`Calculated osmolality: ${fm(c,1)} mOsm/kg`+(gap!=null?`\nOsmolal gap: ${fm(gap,1)} mOsm/kg (${hi?'HIGH':'normal'})`:''),
html:hd('Calculated Osmolality')+big(fm(c,1),'mOsm/kg')+(gap!=null?pr2(tl('Osmolal Gap',fm(gap,1),'mOsm/kg',{p:pill({l:hi?'HIGH':'Normal',t:hi?'r':'g'})})):'')
+nb(gap==null?'A normal osmolal gap is typically &lt; 10-15. Enter a measured osmolality to calculate the gap.':hi?`An osmolal gap of <span class="hx">${fm(gap,1)}</span> is considered HIGH. This suggests the presence of unmeasured, osmotically active substances (e.g., ethanol, methanol, ethylene glycol).`:`An osmolal gap of ${fm(gap,1)} is within the normal range (&lt;15).`)}}}},

return`<section class="ro" style="--st:${c}"><div class="sl">Inputs changed — tap ${t.o.b} to refresh</div>${h}<div class="ac"><button data-a="copy" ${ok?'':'disabled'}>${ic('copy')}Copy</button><button data-a="save" ${ok?'':'disabled'}>${ic('save')}Save</button>${navigator.share?`<button data-a="share" ${ok?'':'disabled'}>${ic('share')}Share</button>`:''}</div></section>`}
function otool(t){const c=CAT[t.g],st=ost(t);S.out=null;S.otx=st.r&&!st.r.err?st.r.tx:null;
return`<div style="--c:${c[1]}"><section class="fc o" id="of">${ofields(t)}</section><div id="rw">${opanel(t)}</div></div>`}
function ocalc(sc){const t=S.cur,st=ost(t);st.r=t.o.go(ov(t),st);S.otx=st.r&&!st.r.err?st.r.tx:null;const w=$('#rw');w.innerHTML=opanel(t);w.classList.remove('stale');if(sc&&w.scrollIntoView)w.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'nearest'})}
function ostale(){const w=$('#rw');if(w&&ost(S.cur).r)w.classList.add('stale')}
/* classic unit converter */
function conv(){const c=CONV[S.cv.k],us=Object.entries(c.units),op=s=>us.map(([k,u])=>`<option value="${k}"${k==s?' selected':''}>${u.name}</option>`).join(''),im=S.cv.k=='temperature'?'text':'decimal';
return`<div class="fc o"><div class="fd"><label for="cs">Select Conversion Category</label><select id="cs">${Object.entries(CONV).map(([k,x])=>`<option value="${k}"${k==S.cv.k?' selected':''}>${x.name}</option>`).join('')}</select></div><div class="fd"><div class="cvm"><div class="cvc"><div class="in"><input id="ca" data-cv="a" inputmode="${im}" autocomplete="off" placeholder="0" value="${esc(S.cv.a)}"></div><select id="cu1" aria-label="From unit">${op(S.cv.u1)}</select></div><button class="swapb" data-a="swp" aria-label="Swap units">${ic('swap')}</button><div class="cvc"><div class="in"><input id="cb" data-cv="b" inputmode="${im}" autocomplete="off" placeholder="0" value="${esc(S.cv.b)}"></div><select id="cu2" aria-label="To unit">${op(S.cv.u2)}</select></div></div></div></div><p class="nt" style="text-align:center;margin-top:4px">Type in either box to convert in real-time.</p>`}
function cvgo(w){const c=CONV[S.cv.k],x=num(S.cv[w]),o=w=='a'?'b':'a',su=w=='a'?S.cv.u1:S.cv.u2,tu=w=='a'?S.cv.u2:S.cv.u1;let r='';
if(x!=null){const y=c.convert?c.convert(x,su,tu):x*c.units[su].factor/c.units[tu].factor;if(isFinite(y))r=String(parseFloat(y.toPrecision(6)))}
S.cv[o]=r;const e=$('#c'+o);if(e)e.value=r}
/* report */
const flag=(r,g)=>{const x=num(r),m=String(g).match(/([\d.]+)\s*[-–]\s*([\d.]+)/),l=String(g).match(/<\s*([\d.]+)/),h=String(g).match(/>\s*([\d.]+)/);if(x==null)return'';if(m)return x<+m[1]?'L':x>+m[2]?'H':'';if(l)return x>=+l[1]?'H':'';if(h)return x<=+h[1]?'L':'';return''};
const QA=[['Glucose','mg/dL','70–100'],['Urea','mg/dL','15–40'],['Creatinine','mg/dL','0.6–1.3'],['Sodium','mEq/L','135–145'],['Potassium','mEq/L','3.5–5.1'],['Cholesterol','mg/dL','< 200'],['Triglycerides','mg/dL','< 150'],['Hemoglobin','g/dL','12–16']];
function rtext(){const r=S.rp;return`LABORATORY REPORT\nPatient: ${r.p}  ID: ${r.pid}  Date: ${r.dt}\n`+r.rows.filter(x=>x.n).map(x=>`${x.n}: ${x.r} ${x.u} ${flag(x.r,x.g)} (ref ${x.g})`).join('\n')}
function rhtml(){const r=S.rp;return`<div class="sheet"><h2>Laboratory Report</h2><div>Patient: <b>${esc(r.p)}</b> &nbsp; ID: ${esc(r.pid)} &nbsp; Date: ${esc(r.dt)}</div><table><tr><th>Test</th><th>Result</th><th>Unit</th><th>Reference</th></tr>${r.rows.filter(x=>x.n).map(x=>`<tr><td>${esc(x.n)}</td><td><b>${esc(x.r)} ${flag(x.r,x.g)}</b></td><td>${esc(x.u)}</td><td>${esc(x.g)}</td></tr>`).join('')}</table></div>`}
const rrows=()=>S.rp.rows.map((x,i)=>`<div class="rr"><input class="w" data-r="n" data-i="${i}" placeholder="Test name" value="${esc(x.n)}"><button class="ib" data-a="rdel" data-i="${i}" aria-label="Remove row">${ic('trash')}</button><input data-r="r" data-i="${i}" placeholder="Result" inputmode="decimal" value="${esc(x.r)}"><input data-r="u" data-i="${i}" placeholder="Unit" value="${esc(x.u)}"><input data-r="g" data-i="${i}" placeholder="Range" value="${esc(x.g)}"></div>`).join('');
function rep(){const r=S.rp;return`<div class="fc" style="margin-top:6px"><div class="fd"><label>Patient name</label><div class="in"><input data-p="p" value="${esc(r.p)}"></div></div><div class="fd h"><label>ID</label><div class="in"><input data-p="pid" value="${esc(r.pid)}"></div></div><div class="fd h"><label>Date</label><div class="in"><input type="date" data-p="dt" value="${esc(r.dt)}"></div></div></div>
<div class="sh" style="padding-top:6px"><h3>Results</h3></div><div class="chips">${QA.map((q,i)=>`<button class="chip" data-a="radd" data-i="${i}">+ ${q[0]}</button>`).join('')}</div><div class="fc" style="display:block" id="rr">${rrows()}<button class="btn" data-a="radd" data-i="-1">+ Add row</button></div>
<div class="ac" style="margin:0 16px"><button class="btn" style="flex:1" data-a="rprint">Print report</button><button class="btn" style="flex:1" data-a="rcopy">Copy text</button><button class="btn d" style="flex:0 0 auto" data-a="rclr">Clear</button></div>`}
/* ---------- shell ---------- */
function bar(tab,t){$('#bar').innerHTML=t?`<button class="ib" data-a="back" aria-label="Back">${ic('back')}</button><h1>${t.t}</h1><button class="ib${S.pins.includes(t.id)?' on':''}" data-a="pin" data-id="${t.id}" aria-label="Pin to home">${ic('star')}</button>`:`<div class="logo"><svg viewBox="0 0 24 24" style="width:20px;height:20px;stroke-width:2.6"><path d="M12 5v14M5 12h14"/></svg></div><h1>LabGenie</h1><button class="ib" data-a="srch" aria-label="Search">${ic('search')}</button><button class="ib" data-a="tgl" aria-label="Toggle theme">${ic('moon')}</button>`}
function nav(tab){$('#tb').innerHTML=[['home','Home','home'],['tools','Tools','grid'],['history','Saved','hist'],['more','More','more']].map(([h,l,i])=>`<a href="#${h}" class="${tab==h?'on':''}">${ic(i)}${l}</a>`).join('')}
function render(){const h=decodeURIComponent(location.hash.slice(1)),t=h&&by(h);let tab=h||'home',html;S.cur=null;S.edit=t?0:S.edit;
if(t){tab='tool';html=tool(t);S.rec=[t.id,...S.rec.filter(x=>x!=t.id)].slice(0,6);ST.set('rec',S.rec)}
else if(h=='tools')html=tools();else if(h=='history')html=hist();else if(h=='more'||h=='help'||h=='dev-instructions'){tab='more';html=more()}else{tab='home';html=home()}
bar(tab,t);nav(tab=='tool'?'':tab);const v=$('#v');v.className='v';v.innerHTML=html;void v.offsetWidth;window.scrollTo(0,0);document.title=t?t.t+' | LabGenie':'LabGenie';}
const re=()=>{const y=scrollY,v=$('#v');v.innerHTML=({home,tools,history:hist,more}[location.hash.slice(1)||'home']||home)();scrollTo(0,y)};
addEventListener('hashchange',()=>{S.nav++;render()});
/* ---------- events ---------- */
document.addEventListener('click',e=>{
const cd=e.target.closest('a.card[data-id]');if(S.edit&&cd){e.preventDefault();S.pins=S.pins.filter(x=>x!=cd.dataset.id);ST.set('pins',S.pins);return re()}
const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,d=b.dataset;if(b.closest('a'))e.preventDefault();
const A={back:()=>S.nav?history.back():(location.hash='home'),
srch:()=>{location.hash='tools';setTimeout(()=>{const q=$('#q');q&&q.focus()},60)},
tgl:()=>{S.th=document.documentElement.dataset.e=='dark'?'light':'dark';ST.set('th',S.th);theme()},
edit:()=>{S.edit=!S.edit;re()},
cat:()=>{S.cat=d.k;if(location.hash!='#tools')location.hash='tools';else re()},
pin:()=>{const i=S.pins.indexOf(d.id);i<0?S.pins.push(d.id):S.pins.splice(i,1);ST.set('pins',S.pins);toast(i<0?'Pinned to Home':'Removed from Home');if(S.cur)bar('tool',S.cur);else re()},
copy:()=>cp(sumry()),save:()=>{S.hist.unshift({ts:Date.now(),tx:sumry()});S.hist=S.hist.slice(0,100);ST.set('hist',S.hist);toast('Saved to history')},
share:()=>navigator.share({title:S.cur.t,text:sumry()}).catch(()=>{}),
reset:()=>{delete S.v[S.cur.id];if(S.cur.o)delete OS[S.cur.id];$('#v').innerHTML=tool(S.cur)},
ob:()=>{const t=S.cur,st=ost(t);st.v[d.f]=d.v;$('#of').innerHTML=ofields(t);t.o.auto?ocalc():ostale()},op:()=>A.ob(),calc:()=>ocalc(1),
hcopy:()=>cp(S.hist[d.i].tx),hdel:()=>{S.hist.splice(d.i,1);ST.set('hist',S.hist);re()},hclr:()=>{S.hist=[];ST.set('hist',[]);re()},
th:()=>{S.th=d.v;ST.set('th',S.th);theme();re()},dec:()=>{S.dec=d.v;ST.set('dec',S.dec);re()},rst:()=>{S.pins=[...DEF];ST.set('pins',S.pins);toast('Shortcuts reset')},
swp:()=>{[S.cv.u1,S.cv.u2]=[S.cv.u2,S.cv.u1];cvgo('a');$('#v').innerHTML=conv()},
radd:()=>{const q=QA[d.i];S.rp.rows=S.rp.rows.filter(x=>x.n||x.r);S.rp.rows.push(q?{n:q[0],r:'',u:q[1],g:q[2]}:{n:'',r:'',u:'',g:''});sv();$('#rr').innerHTML=rrows()+'<button class="btn" data-a="radd" data-i="-1">+ Add row</button>'},
rdel:()=>{S.rp.rows.splice(d.i,1);sv();$('#rr').innerHTML=rrows()+'<button class="btn" data-a="radd" data-i="-1">+ Add row</button>'},
rprint:()=>{$('#pr').innerHTML=rhtml();print()},rcopy:()=>cp(rtext()),rclr:()=>{S.rp.rows=[{n:'',r:'',u:'',g:''}];S.rp.p=S.rp.pid='';sv();$('#v').innerHTML=rep()}};A[a]&&A[a]()});
const sv=()=>ST.set('rp',S.rp);
function sumry(){return S.cur.t+'\n'+(S.cur.o?S.otx:S.out.map(line).join('\n'))}
function cp(x){const f=()=>{const t=document.createElement('textarea');t.value=x;document.body.appendChild(t);t.select();try{document.execCommand('copy')}catch(e){}t.remove()};(navigator.clipboard?navigator.clipboard.writeText(x).catch(f):f());toast('Copied')}
document.addEventListener('input',e=>{const el=e.target;
if(el.id=='q'){S.q=el.value;$('#list').innerHTML=list()}
else if(el.dataset.cv){S.cv[el.dataset.cv]=el.value;cvgo(el.dataset.cv)}
else if(el.dataset.o!=null&&S.cur&&S.cur.o){ost(S.cur).v[el.dataset.o]=el.value;S.cur.o.auto?ocalc():ostale()}
else if(el.dataset.p){S.rp[el.dataset.p]=el.value;sv()}
else if(el.dataset.r){S.rp.rows[el.dataset.i][el.dataset.r]=el.value;sv()}
else if(el.dataset.i&&S.cur){S.v[S.cur.id][el.dataset.i]=el.value;upd()}});
document.addEventListener('change',e=>{const el=e.target;if(el.id=='cs'){const us=Object.keys(CONV[el.value].units);S.cv={k:el.value,u1:us[0],u2:us[Math.min(1,us.length-1)],a:'',b:''};$('#v').innerHTML=conv()}
else if(el.id=='cu1'){S.cv.u1=el.value;cvgo('a')}else if(el.id=='cu2'){S.cv.u2=el.value;cvgo('b')}
else if(el.dataset.i&&S.cur&&el.tagName=='SELECT'){S.v[S.cur.id][el.dataset.i]=el.value;$('#fc').innerHTML=S.cur.F.map(f=>field(S.cur,f)).join('');upd()}});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.tagName=='INPUT'){if(S.cur&&S.cur.o&&!S.cur.o.auto&&e.target.dataset.o!=null)ocalc(1);e.target.blur()}});
document.addEventListener('focusin',e=>{if(/INPUT|SELECT/.test(e.target.tagName)&&S.cur)document.body.classList.add('kb')});
document.addEventListener('focusout',()=>setTimeout(()=>{if(!/INPUT|SELECT/.test(document.activeElement.tagName))document.body.classList.remove('kb')},120));
/* ---------- boot ---------- */
theme();render();
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
</script>
